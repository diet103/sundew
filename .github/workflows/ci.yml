name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx vitest run
            # npm run build = tsc --noEmit && vite build && postbuild; check:size
            # reads the /forms asset layout that postbuild creates.
            - run: npm run build
            - run: npm run check:size
            # Content check: patterns come from a repo secret so the list itself
            # never appears in the public repo. Skipped when the secret is unset.
            # sed drops blank lines (a stray empty pattern would match every
            # file); -q keeps matches (and case variants the secret masker would
            # miss) out of the public Actions log.
            - name: Content check
              if: ${{ github.event_name == 'push' }}
              env:
                  BLOCKED_PATTERNS: ${{ secrets.BLOCKED_PATTERNS }}
              run: |
                  PATTERNS=$(printf '%s\n' "$BLOCKED_PATTERNS" | sed '/^[[:space:]]*$/d')
                  if [ -n "$PATTERNS" ]; then
                      if printf '%s\n' "$PATTERNS" | grep -qriwF -f - --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist .; then
                          echo "Blocked pattern found"; exit 1
                      fi
                  fi

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # Provision .dev.vars BEFORE playwright runs: its webServer boots
            # ahead of global-setup, so the stub flag must already exist when
            # the worker starts. Global-setup sees the file and leaves it alone.
            - run: |
                  cp .dev.vars.example .dev.vars
                  sed -i 's/^E2E_AUTH_STUB=.*/E2E_AUTH_STUB=1/' .dev.vars
            - run: npm run e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces
                  path: test-results/
                  retention-days: 7
