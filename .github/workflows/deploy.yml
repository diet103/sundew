name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency: deploy

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Skip cleanly (green, near-zero cost) until the Cloudflare secrets
            # from DEPLOY.md exist — a fresh fork shouldn't start with a red
            # Actions tab. Job-level `if` can't read secrets, hence the step.
            - name: Check Cloudflare credentials
              id: creds
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Cloudflare secrets not set; skipping deploy."
                  fi
            - uses: actions/checkout@v4
              if: steps.creds.outputs.configured == 'true'
            - uses: actions/setup-node@v4
              if: steps.creds.outputs.configured == 'true'
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
              if: steps.creds.outputs.configured == 'true'
            - run: npx vitest run
              if: steps.creds.outputs.configured == 'true'
            # npm run build includes tsc and the postbuild /forms asset layout
            # that both check:size and the deployed worker depend on.
            - run: npm run build
              if: steps.creds.outputs.configured == 'true'
            - run: npm run check:size
              if: steps.creds.outputs.configured == 'true'
            - name: Apply D1 migrations
              if: steps.creds.outputs.configured == 'true'
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: d1 migrations apply DB --remote
            - name: Deploy worker
              if: steps.creds.outputs.configured == 'true'
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config dist/sundew/wrangler.json
