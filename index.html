<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            // Theme before first paint: dark is the default presentation;
            // light is a stored opt-in (see ThemeToggle).
            (function () {
                try {
                    if (localStorage.getItem('sundew:theme') !== 'light') {
                        document.documentElement.classList.add('theme-dark');
                    }
                } catch (error) {
                    document.documentElement.classList.add('theme-dark');
                }
            })();
        </script>
        <title>Sundew · an open-source form builder</title>
        <meta
            name="description"
            content="Build a form in your browser right now. Drag-and-drop questions, conditional logic, autosave, share links. No sign-up to try. Open source, MIT, by Dieter Grosswiler."
        />
        <link rel="icon" href="/forms/favicon.svg" type="image/svg+xml" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
